[package]
name = "fogline-desktop"
version = "0.1.0"
description = "Fogline: offline, game-agnostic interactive map viewer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fogline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Moves pack folders to the system trash (never deletes permanently).
trash = "5"
# Extracts .fogpack archives.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
